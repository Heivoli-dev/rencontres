function makeAgent(p, isMe) {
  const cfg = recipeToCfg(p.recipe);
  return { name: p.name || '?', message: p.message || '', cfg: cfg, base: cfg.anim, me: !!isMe,
    x: rnd(-0.8, 0.8), z: rnd(0.15, 0.95), tx: 0, tz: 0, state: 'idle', timer: rnd(0.5, 3), face: rnd(-1, 1),
    anim: 0, bubble: '', partner: null, cool: rnd(2, 5), phase: Math.random() * 10 };

window.setPlaza = function (data) {
  const list = [];
  if (data && data.me) list.push(makeAgent(data.me, true));
  ((data && data.others) || []).slice(0, 14).forEach(p => list.push(makeAgent(p, false)));
  agents = list;
  return agents.length;
};

function pickTarget(a) { a.tx = rnd(-0.85, 0.85); a.tz = rnd(0.1, 0.98); a.state = 'walk'; }

function update(dt) {
  for (const a of agents) {
    a.cool = Math.max(0, a.cool - dt);
    a.timer -= dt;
    if (a.state === 'walk') {
      const dx = a.tx - a.x, dz = a.tz - a.z, d = Math.hypot(dx, dz);
      if (d < 0.02) { a.state = 'idle'; a.timer = rnd(1.5, 4); a.anim = 0; }
      else { const v = 0.16 * dt; a.x += dx / d * Math.min(v, d); a.z += dz / d * Math.min(v, d); a.face = Math.atan2(dx, dz); }
    } else if (a.state === 'idle') {
      a.anim = 0;
      a.face += (0 - a.face) * Math.min(1, dt);
      if (a.timer <= 0) pickTarget(a);
    } else if (a.state === 'meet') {
      if (a.timer <= 0) { a.state = 'idle'; a.timer = rnd(0.5, 2); a.bubble = ''; a.cool = rnd(6, 10); a.partner = null; }
    }
  }
  // Rencontres entre créatures qui se baladent
  for (let i = 0; i < agents.length; i++) for (let j = i + 1; j < agents.length; j++) {
    const a = agents[i], b = agents[j];
    if (a.state === 'meet' || b.state === 'meet' || a.cool > 0 || b.cool > 0) continue;
    if (Math.hypot(a.x - b.x, (a.z - b.z) * 1.6) < 0.22) {
      const anims = [1, 2, 3];
      for (const [p, q] of [[a, b], [b, a]]) {
        p.state = 'meet'; p.partner = q; p.timer = 3.2;
        p.face = Math.atan2(q.x - p.x, q.z - p.z);
        p.anim = anims[Math.floor(Math.random() * anims.length)];

  lx.setTransform(dpr, 0, 0, dpr, 0, 0);
  lx.clearRect(0, 0, cw, ch);
  lx.textAlign = 'center'; lx.textBaseline = 'middle';
  const boxes = [];
  for (const p of placed.slice().reverse()) {
    let y = p.y * k; const x = p.x * k;
    for (let n = 0; n < 6; n++) { const hit = boxes.find(b => Math.abs(b.x - x) < 70 && Math.abs(b.y - y) < 22); if (!hit) break; y = hit.y - 22; }
    boxes.push({ x: x, y: y }); p.ly = y;
  }
  for (const p of placed) {
    const x = p.x * k, y = p.ly;
    lx.font = '800 12px -apple-system, system-ui, sans-serif';
    const tw = lx.measureText(p.a.name).width + 14;
    lx.fillStyle = p.a.me ? '#2FB36A' : 'rgba(255,255,255,0.95)';
    roundRect(lx, x - tw / 2, y - 10, tw, 20, 10); lx.fill();
    lx.fillStyle = p.a.me ? '#FFFFFF' : '#26313B';
    lx.fillText(p.a.name, x, y + 0.5);
    if (p.a.bubble) {
      lx.font = '700 12px -apple-system, system-ui, sans-serif';
      const bw = Math.min(170, lx.measureText(p.a.bubble).width + 18), by = y - 34;
      lx.fillStyle = '#FFFFFF'; roundRect(lx, x - bw / 2, by - 12, bw, 24, 12); lx.fill();
      lx.beginPath(); lx.moveTo(x - 5, by + 11); lx.lineTo(x + 5, by + 11); lx.lineTo(x, by + 18); lx.fill();
      lx.fillStyle = '#26313B'; lx.fillText(p.a.bubble.length > 26 ? p.a.bubble.slice(0, 25) + '…' : p.a.bubble, x, by + 0.5);
    }
  }
  if (agents.length <= 1) {
    lx.font = '700 13px -apple-system, system-ui, sans-serif';
    lx.fillStyle = 'rgba(38,49,59,0.8)';
    lx.fillText('Croise des gens pour remplir ta place !', cw / 2, ch * 0.12);
  }
}
requestAnimationFrame(frame);
</script>
